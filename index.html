<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #2a1a0e 0%, #4a2c14 100%);
  color: #f5e6c8;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overflow-x: hidden;
}
#app {
  width: 100%; max-width: 420px; margin: 0 auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
}
.gp-home-btn {
  position: fixed; top: 12px; right: 12px; z-index: 50;
  font-size: 18px; text-decoration: none; opacity: 0.4; color: #f5e6c8;
}
.gp-home-btn:active { opacity: 0.8; }

/* 顶部标题 */
.title { text-align: center; font-size: 30px; font-weight: 800; margin: 4px 0 4px; letter-spacing: 2px; }

/* 佛像轮播 */
#carousel { position: relative; width: 100%; margin-bottom: 12px; padding-top: 8px; }
#carousel-track {
  display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; cursor: grab;
  padding: 0 14%; gap: 8px; touch-action: pan-x;
}
#carousel-track::-webkit-scrollbar { display: none; }
.buddha-slot {
  flex: 0 0 calc(100% - 8px); scroll-snap-align: center; scroll-snap-stop: always;
  padding: 14px; text-align: center;
  background: rgba(255,255,255,0.06); border-radius: 14px;
  border: 2px solid transparent; transition: border-color .18s, transform .18s;
}
.buddha-slot.selected { border-color: #ffd76a; transform: scale(1.02); }
.buddha-slot img {
  width: 120px; height: 120px; object-fit: contain; image-rendering: pixelated;
  margin-bottom: 6px; background: #3a1f0a; border-radius: 12px;
}
.buddha-slot .slot-emoji {
  width: 120px; height: 120px; display: flex; align-items: center; justify-content: center;
  font-size: 80px; color: #ffd76a; margin: 0 auto 6px; background: rgba(255,255,255,0.06); border-radius: 12px;
}
.buddha-slot .b-name { font-size: 18px; font-weight: 700; }
.buddha-slot .b-rate { font-size: 12px; color: #d8c39a; margin-top: 2px; }

.buddha-meta { text-align: center; margin-bottom: 10px; min-height: 44px; }
.buddha-meta .b-words { font-size: 15px; color: #ffd76a; font-style: italic; }

/* 许愿区 */
#wish-section { margin-bottom: 12px; }
#wish-input {
  width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #6b4a26;
  background: rgba(0,0,0,0.25); color: #f5e6c8; font-size: 16px;
  -webkit-user-select: text; user-select: text;
}
#wish-input::placeholder { color: #a98d5f; }

/* 硬币区 */
#coin-area { display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; }
.coin-stage { perspective: 600px; width: 120px; height: 120px; margin-bottom: 12px; animation: coinBob 2s ease-in-out infinite; }
#coin {
  position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
  transition: transform 1.25s cubic-bezier(.3,.7,.15,1);
}
.coin-face { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; background-size: 110%; background-position: center; background-color: #2a1a0e; }
#coin-head {
  background-image: url('assets/pixel_art_sprite__retro_16_bit_2026-08-20T06-59-50.png');
}
#coin-tail {
  background-image: url('assets/pixel_art_sprite__retro_16_bit_2026-08-20T07-00-05.png');
  transform: rotateY(180deg);
}
#coin.still { animation: none; }
@keyframes coinBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* 投币按钮 */
.btn {
  width: 100%; padding: 13px; border: none; border-radius: 12px;
  font-size: 17px; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .05s;
}
.btn:active { transform: scale(.98); }
.btn-toss { background: linear-gradient(180deg, #ffd76a, #e8a838); color: #5a3206; }
.btn-toss:disabled { opacity: .45; }

/* 结果反馈 */
#result { min-height: 30px; text-align: center; font-size: 15px; margin: 10px 0 4px; font-weight: 600; }
#result.gold { color: #ffd76a; text-shadow: 0 0 12px rgba(255,215,106,.7); }

/* 状态区 */
#status { text-align: center; font-size: 13px; color: #d8c39a; margin-bottom: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 历史 */
#history { margin-top: 4px; }
#history h3 { font-size: 15px; color: #ffd76a; margin-bottom: 6px; }
.h-item { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; line-height: 1.5; color: #ead9b3; }
.h-item .h-wish { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.h-item.tier-1 { border-left: 3px solid #ffd76a; }
.h-item.tier-2 { border-left: 3px solid #c9a84c; }
.h-item.tier-3 { border-left: 3px solid rgba(255,255,255,0.2); }
.h-item .h-time { color: #a98d5f; }

#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #2a1a0e; color: #ffd76a; z-index: 99; }

/* 祝贺弹窗 */
.celebrate-overlay {
  position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.65); opacity: 0; pointer-events: none; transition: opacity .3s;
}
.celebrate-overlay.show { opacity: 1; pointer-events: auto; }
.celebrate-card {
  background: linear-gradient(160deg, #3d1f08, #5a3206);
  border: 2px solid #ffd76a; border-radius: 18px; padding: 28px 24px 22px;
  text-align: center; max-width: 300px; width: 85%; position: relative; z-index: 2;
  box-shadow: 0 0 40px rgba(255,215,106,.35);
  animation: popIn .4s cubic-bezier(.4,0,.2,1);
}
.celebrate-card .cc-icon { font-size: 48px; margin-bottom: 8px; }
.celebrate-card .cc-bless { font-size: 16px; font-weight: 700; color: #ffd76a; line-height: 1.6; margin-bottom: 14px; }
.celebrate-card .cc-stats { font-size: 13px; color: #d8c39a; line-height: 1.8; }
.celebrate-card .cc-btns { display: flex; gap: 10px; margin-top: 14px; }
.celebrate-card .cc-btns button { flex: 1; padding: 8px 12px; border-radius: 10px; font-size: 15px; cursor: pointer; }
.celebrate-card .cc-end { background: transparent; color: #f5e6c8; border: 1px solid #f5e6c8; }
.celebrate-card .cc-end:active { background: rgba(255,255,255,.1); }
.celebrate-card .cc-close { border: 1px solid #ffd76a; background: transparent; color: #ffd76a; }
.celebrate-card .cc-close:active { background: rgba(255,215,106,.15); }
@keyframes popIn { 0% { transform: scale(.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* 撒花粒子 */
.confetti {
  position: fixed; z-index: 81; pointer-events: none;
  font-size: 22px; animation: fall linear forwards;
}
@keyframes fall {
  0% { transform: translateY(-80px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

/* 结算弹窗 */
.settle-card { max-width: 320px; }
.settle-card .sc-icon { font-size: 40px; margin-bottom: 6px; }
.settle-card .sc-title { font-size: 18px; font-weight: 700; color: #ffd76a; margin-bottom: 10px; }
.settle-card .sc-row { font-size: 14px; color: #d8c39a; line-height: 2; }
.settle-card .sc-row span { color: #f5e6c8; }
.settle-card .sc-btns { display: flex; gap: 10px; margin-top: 16px; }
.settle-card .sc-btns button { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid #ffd76a; font-size: 15px; cursor: pointer; }
.settle-card .sc-confirm { background: linear-gradient(180deg, #ffd76a, #e8a838); color: #5a3206; border: none; font-weight: 700; }
.settle-card .sc-cancel { background: transparent; color: #f5e6c8; }

@media (prefers-reduced-motion: reduce) {
  .buddha-slot { transition: none; }
  .buddha-slot.selected { transform: none; }
}
</style>
</head>
<body>
<div id="loading">加载中…</div>
<div id="celebrate" class="celebrate-overlay">
  <div class="celebrate-card">
    <div class="cc-icon">🎉</div>
    <div class="cc-bless" id="cc-bless"></div>
    <div class="cc-stats" id="cc-stats"></div>
    <div class="cc-btns">
      <button class="cc-end" id="cc-end">结束本次</button>
      <button class="cc-close" id="cc-close">继续</button>

  </div>
</div>

  <div class="celebrate-card settle-card">

      <button class="sc-confirm" id="sc-confirm">结束</button>

<div id="app" style="display:none">
  <div class="title">🙏 佛前投币</div>

  <div id="carousel">

  </div>
  <div id="buddha-meta" class="buddha-meta">

  </div>

  <div id="wish-section">
    <input id="wish-input" type="text" maxlength="30" placeholder="写下你的心愿…" inputmode="default">

  <div id="coin-area">
    <div class="coin-stage">
      <div id="coin" class="still">

  <div id="status">已投 <span id="status-throws">0</span> 次 · 中 <span id="status-hit">0</span>/<span id="status-total">0</span> · 成功率 <span id="status-rate">--</span></div>

  <div id="history">
    <h3>最近 10 次</h3>
  </div>
</div>
<a href="https://game-list-arv.pages.dev" class="gp-home-btn" title="主页">🏠</a>
<script src="https://api.w1lkin.site/sdk.js"></script>
<script>
(function () {
  'use strict';

  var BUDDHAS = [
    { id:'guanyin', name:'观音', rate:0.55, words:'慈悲加持，所愿皆成',  img:'assets/pixel_art_sprite__retro_16_bit_2026-08-20T06-57-47.png',
      titles:['大慈大悲的观音菩萨','慈航普渡的观世音','愿垂慈悯的观音'] },
    { id:'mile',  name:'弥勒', rate:0.60, words:'笑口常开，好运自然来',  img:'assets/pixel_art_sprite__retro_16_bit_2026-08-20T06-58-05.png',
      titles:['袒腹欢颜的弥勒','笑口常开的弥勒佛','喜气盈门的弥勒'] },
    { id:'rulai', name:'如来', rate:0.50, words:'如来见证，静待花开',  img:'assets/pixel_art_sprite__retro_16_bit_2026-08-20T06-58-20.png',
      titles:['清净圆满的如来','我佛如来','万法皆空的如来'] },
    { id:'wenshu',name:'文殊', rate:0.53, words:'智慧光明，迷障尽除',  img:'assets/pixel_art_sprite__retro_16_bit_2026-08-20T06-58-42.png',
      titles:['智慧第一的文殊','慧剑出尘的文殊师利','妙光妙智的文殊'] },
    { id:'puxian',name:'普贤', rate:0.52, words:'行愿圆满，前路坦途',  img:'assets/pixel_art_sprite__retro_16_bit_2026-08-20T06-58-59.png',
      titles:['行愿无碍的普贤','大行大愿的普贤菩萨','坚笃行愿的普贤'] },
    { id:'dizang',name:'地藏', rate:0.54, words:'誓愿深重，苦难得度',  img:'assets/pixel_art_sprite__retro_16_bit_2026-08-20T06-59-16.png',
      titles:['誓度众生的地藏','慈心悲愿的地藏王','静护十方的地藏'] },
    { id:'yaoshi',name:'药师', rate:0.56, words:'消灾延寿，身心安康',  img:'assets/pixel_art_sprite__retro_16_bit_2026-08-20T06-59-34.png',
      titles:['消灾延寿的药师佛','琉璃光明的药师如来','福慧双修的药师'] },
    { id:'self',  name:'信自己', rate:0.50, words:'心诚则灵，你自己最灵',  img:null,
      titles:['笃定的你','心诚的你','相信自己的你'] }
  ];

  // 心愿主题分类：按关键词匹配，命中后生成对应风格的祝福
  var WISH_THEMES = [
    { re: /钱|财|富|暴富|加薪|涨薪|发财|money|财运|赚钱|收入|股票|中奖/,
      tag:'财运', open:['愿财路亨通','求财得财','聚四方才气'],
      close:'财源广进，富足顺遂，金银满室' },
    { re: /学业|考试|考研|上岸|学习|升学|论文|分数|成绩|上岸|offer|录取|毕业/,
      tag:'学业', open:['愿笔下生花','考运亨通','慧心通明'],
      close:'金榜题名，学业精进，一路繁花' },
    { re: /健康|身体|病|康复|痊愈|无病|平安|无恙|健健康康|祛病/,
      tag:'健康', open:['愿百邪不侵','病去福来','元气满身'],
      close:'身康体健，福寿绵长，无病无忧' },
    { re: /姻缘|爱情|脱单|恋爱|结婚|喜欢|对象|幸福|相伴|脱单/,
      tag:'姻缘', open:['愿良缘早至','两情相悦','红鸾星动'],
      close:'良缘天成，佳偶成双，相伴一生' },
    { re: /事业|工作|创业|升职|晋级|项目|生意|业绩|offer|面试|入职/,
      tag:'事业', open:['愿步步高升','乘风而上','宏图大展'],
      close:'事业顺遂，前程远大，贵人相扶' },
    { re: /顺利|好运|顺|转运|时来运转|心想事成|万事|一切/,
      tag:'顺遂', open:['愿诸事可期','时来运转','得偿所愿'],
      close:'诸事顺遂，好运常伴，平安如意' }
  ];
  var DEFAULT_THEME = { open:['愿心之所向','所求皆有回响','所愿皆可期'],
                        close:'万事顺遂，心想事成，平安欢喜' };

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // 根据佛 + 心愿主题 + 随机句式，生成多样化祝福语
  function blessResult(b, wish) {
    if (!b.titles || !b.titles.length) return b.words;
    var theme = DEFAULT_THEME;
    if (wish) {
      for (var i = 0; i < WISH_THEMES.length; i++) {
        if (WISH_THEMES[i].re.test(wish)) { theme = WISH_THEMES[i]; break; }
      }
    }
    var title = pick(b.titles), open = pick(theme.open), close = theme.close;
    var w = wish ? '「' + wish + '」' : '此愿';
    var templates = [
      title + '，' + w + '终得所愿。' + open + '，' + close + '。',
      '诚心已至' + title + '座前，' + w + '必有回响——' + open + '，' + close + '。',
      open + '，' + title + '为证，' + w + '得佑。' + close + '。',
      title + '加持，' + w + '可期。' + open + '，' + close + '。'
    ];
    return pick(templates);
  }

  var track = document.getElementById('carousel-track');
  var currentBuddhaIndex = 0;

  function renderBuddhas() {
    track.innerHTML = '';
    BUDDHAS.forEach(function (b, i) {
      var slot = document.createElement('div');
      slot.className = 'buddha-slot';
      if (i === currentBuddhaIndex) slot.classList.add('selected');
      if (b.img) {
        var img = document.createElement('img');
        img.src = b.img; img.alt = b.name;
        slot.appendChild(img);
      } else {
        var e = document.createElement('div');
        e.className = 'slot-emoji'; e.textContent = '✨';
        slot.appendChild(e);
      }
      var name = document.createElement('div');
      name.className = 'b-name'; name.textContent = b.name;
      var rate = document.createElement('div');
      rate.className = 'b-rate'; rate.textContent = '应验率 ' + Math.round(b.rate * 100) + '%';
      slot.appendChild(name); slot.appendChild(rate);
      track.appendChild(slot);
    });
    updateMeta();
  }

  function updateMeta() {
    var b = BUDDHAS[currentBuddhaIndex];
    document.getElementById('buddha-name').textContent = '「' + b.name + '」';
    document.getElementById('buddha-words').textContent = b.words;
    document.getElementById('buddha-rate').textContent = '应验率 ' + Math.round(b.rate * 100) + '%';
  }

  function selectBuddha(i) {
    currentBuddhaIndex = i;
    var slots = track.querySelectorAll('.buddha-slot');
    slots.forEach(function (s, idx) { s.classList.toggle('selected', idx === i); });
    updateMeta();
  }

  // 滑动结束时，以中心位佛为准选择
  function pickCentered() {
    var centerX = track.scrollLeft + track.clientWidth / 2;
    var slots = track.querySelectorAll('.buddha-slot');
    var best = 0, bestDist = Infinity;
    slots.forEach(function (s, idx) {
      var c = s.offsetLeft + s.clientWidth / 2;
      var d = Math.abs(c - centerX);
      if (d < bestDist) { bestDist = d; best = idx; }
    });
    selectBuddha(best);
  }

  track.addEventListener('scroll', pickCentered, { passive: true });

  var coin = document.getElementById('coin');
  var resultEl = document.getElementById('result');
  var btnToss = document.getElementById('btn-toss');
  var wishInput = document.getElementById('wish-input');
  var flipping = false;

  var state = { throws: 0, totalHits: 0, missStreak: 0, hitStreak: 0, wish: '', accepted: false, buddhaName: BUDDHAS[0].name };
  var spin = 0; // 累计旋转角度，确保每次投币都有完整翻转动画

  function tossCoin() {
    if (flipping) return; // animating
    state.wish = (wishInput.value || '').trim();
    state.buddhaName = BUDDHAS[currentBuddhaIndex].name;
    state.throws += 1;

    var b = BUDDHAS[currentBuddhaIndex];
    var ok = Math.random() < b.rate;

    flipping = true;
    coin.classList.remove('still');
    btnToss.disabled = true;
    // 每投一次先转 720°，再依结果偏 0°(正面/字) 或 180°(反面/花)，令结果面朝上
    spin += 720;
    coin.style.transform = 'rotateY(' + (spin + (ok ? 0 : 180)) + 'deg)';

    setTimeout(function () {
      coin.classList.add('still');
      btnToss.disabled = false;
      flipping = false;

      if (ok) {
        state.accepted = true;
        state.totalHits += 1;
        state.missStreak = 0;
        state.hitStreak = (state.hitStreak || 0) + 1;
        resultEl.className = 'gold';
        var bless = blessResult(b, state.wish);
        resultEl.innerHTML = '✨ 佛已应允 · ' + bless;
        showCelebrate(bless, state.throws, state.totalHits);
      } else {
        state.missStreak += 1;
        state.hitStreak = 0;
        resultEl.className = '';
        resultEl.textContent = '🪙 再试一次';
      }
      updateStatus();
    }, 1350);
  }

  function updateStatus() {
    document.getElementById('status-throws').textContent = state.throws;
    document.getElementById('status-hit').textContent = state.totalHits;
    document.getElementById('status-total').textContent = state.throws;
    var rate = state.throws > 0 ? Math.round(state.totalHits / state.throws * 100) + '%' : '--';
    document.getElementById('status-rate').textContent = rate;
  }

  btnToss.addEventListener('click', tossCoin);

  var HISTORY_KEY = 'coin-toss:history';
  var HISTORY = loadHistory();

  function loadHistory() {
    try {
      var arr = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(HISTORY)); } catch (e) { /* ignore */ }
  }

  function resetRound() {
    state = { throws: 0, totalHits: 0, missStreak: 0, hitStreak: 0, wish: '', accepted: false, buddhaName: BUDDHAS[0].name };
    spin = 0;
    wishInput.value = '';
    resultEl.textContent = '';
    resultEl.className = '';
    updateStatus();
  }

  function settle() {
    // 弹出结算框
    var buddha = BUDDHAS[currentBuddhaIndex];
    document.getElementById('sc-wish').textContent = state.wish || '（未写心愿）';
    document.getElementById('sc-buddha').textContent = state.buddhaName || buddha.name;
    document.getElementById('sc-throws').textContent = state.throws;
    var rate = state.throws > 0 ? Math.round(state.totalHits / state.throws * 100) : 0;
    document.getElementById('sc-result').textContent = '中 ' + state.totalHits + '/' + state.throws + ' · 成功率 ' + rate + '%';
    document.getElementById('settle-overlay').classList.add('show');
  }

  function doSettle() {
    HISTORY.push({
      wish: state.wish || '（未写心愿）',
      buddha: state.buddhaName,
      throws: state.throws,
      totalHits: state.totalHits,
      accepted: state.accepted,
      ts: Date.now()
    });
    if (HISTORY.length > 10) HISTORY = HISTORY.slice(HISTORY.length - 10);
    saveHistory();
    renderHistory();
    resetRound();
    document.getElementById('settle-overlay').classList.remove('show');
  }

  document.getElementById('sc-confirm').addEventListener('click', doSettle);
  document.getElementById('sc-cancel').addEventListener('click', function () {
    document.getElementById('settle-overlay').classList.remove('show');
  });
  document.getElementById('settle-overlay').addEventListener('click', function (e) {
    if (e.target === document.getElementById('settle-overlay')) document.getElementById('settle-overlay').classList.remove('show');
  });

  function renderHistory() {
    var box = document.getElementById('history');
    box.querySelectorAll('.h-item').forEach(function (n) { n.remove(); });
    var h = box.querySelector('h3');
    HISTORY.slice().reverse().forEach(function (r) {
      var div = document.createElement('div');
      var totalHits = r.totalHits || 0;
      var rate = r.throws > 0 ? totalHits / r.throws : 0;
      var tier, tierLabel;
      if (r.throws === 0) { tier = 0; tierLabel = '尚未投币'; }
      else if (rate >= 0.8) { tier = 1; tierLabel = '有求必应'; }
      else if (rate >= 0.6) { tier = 2; tierLabel = '心诚则灵'; }
      else if (rate >= 0.4) { tier = 3; tierLabel = '再修善缘'; }
      else { tier = 0; tierLabel = '缘分未到'; }
      div.className = 'h-item' + (tier > 0 ? ' tier-' + tier : '');
      var time = new Date(r.ts);
      var pad = function (n) { return String(n).padStart(2, '0'); };
      var timeStr = pad(time.getMonth() + 1) + '-' + pad(time.getDate()) + ' ' + pad(time.getHours()) + ':' + pad(time.getMinutes());
      var wishText = r.wish && r.wish !== '（未写心愿）' ? r.wish : '默祷于心';
      div.innerHTML =
        '<div class="h-wish">' + escapeHtml(wishText) + '</div>' +
        '<div>' + escapeHtml(r.buddha) + ' · 投了' + r.throws + '回 · 中' + totalHits + '/' + r.throws + ' · ' + tierLabel +
        ' <span class="h-time">' + timeStr + '</span></div>';
      box.insertBefore(div, h.nextSibling);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  document.getElementById('cc-end').addEventListener('click', function () {
    celebOverlay.classList.remove('show');
    doSettle();
  });

  // 祝贺弹窗 + 撒花
  var celebOverlay = document.getElementById('celebrate');
  var celebBless = document.getElementById('cc-bless');
  var celebStats = document.getElementById('cc-stats');
  var celebClose = document.getElementById('cc-close');

  function showCelebrate(bless, throws, hits) {
    celebBless.textContent = bless;
    var rate = throws > 0 ? Math.round(hits / throws * 100) : 0;
    celebStats.textContent = '已投 ' + throws + ' 次 · 中 ' + hits + '/' + throws + ' · 成功率 ' + rate + '%';
    celebOverlay.classList.add('show');
    spawnConfetti();
  }

  celebClose.addEventListener('click', function () {
    celebOverlay.classList.remove('show');
  });
  celebOverlay.addEventListener('click', function (e) {
    if (e.target === celebOverlay) celebOverlay.classList.remove('show');
  });

  function spawnConfetti() {
    var emojis = ['🌸','✨','💮','🏵️','🎊','🌟','🪷','💫'];
    var count = 28;
    for (var i = 0; i < count; i++) {
      var p = document.createElement('span');
      p.className = 'confetti';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (1.8 + Math.random() * 2.2) + 's';
      p.style.animationDelay = Math.random() * 0.6 + 's';
      p.style.fontSize = (18 + Math.random() * 16) + 'px';
      document.body.appendChild(p);
      setTimeout(function () { p.remove(); }, 3500);
    }
  }

  renderHistory();

  window.BUDDHAS = BUDDHAS;
  window.selectBuddha = selectBuddha;
  window.renderBuddhas = renderBuddhas;
  window.updateStatus = updateStatus;
  window.renderHistory = renderHistory;
  window.settle = settle;
})();
</script>
<script>
(function () {
  // 预加载所有图片后显示游戏
  var IMAGES = [].concat(
    BUDDHAS.filter(function(b){return b.img;}).map(function(b){return b.img;}),
    ['assets/pixel_art_sprite__retro_16_bit_2026-08-20T06-59-50.png',
     'assets/pixel_art_sprite__retro_16_bit_2026-08-20T07-00-05.png']
  );

  function preloadAll(onDone) {
    var loaded = 0, total = IMAGES.length;
    if (total === 0) return onDone();
    IMAGES.forEach(function (src) {
      var img = new Image();
      img.onload = img.onerror = function () {
        loaded++;
        if (loaded >= total) onDone();
      };
      img.src = src;
    });
    // 超时兜底 3s
    setTimeout(function () { if (loaded < total) onDone(); }, 3000);
  }

  function startGame() {
    if (window.renderBuddhas) window.renderBuddhas();
    if (window.renderHistory) window.renderHistory();
    if (window.updateStatus) window.updateStatus();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
  }

  function boot() {
    preloadAll(function () {
      if (typeof GamePlatform !== 'undefined') {
        GamePlatform.init();
        GamePlatform.mountGate({ gameId: 'coin-toss' }).then(startGame).catch(startGame);
      } else {
        startGame();
      }
    });
  }
  boot();
})();
</script>
</body>
